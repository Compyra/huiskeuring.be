<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official lookups - huiskeuring.be</title>
    <meta name="description" content="Type a Belgian address once and open every official map and registry a house buyer should check: cadastre (CadGIS), flood maps, soil databases, zoning, permits and heritage - for Flanders, Wallonia and Brussels.">
    <meta name="keywords" content="adres opzoeken, kadaster, CadGIS, overstromingskaart, waterinfo, bodemattest, BDES, Geopunt, WalOnMap, BruGIS, omgevingsloket, plastische gronden, recherche adresse Belgique">
    <link rel="canonical" href="https://huiskeuring.be/lookup/">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="../style.css?v16">
    <link rel="stylesheet" href="../assets/vendor/fonts.css?v16">
    <link rel="stylesheet" href="../assets/vendor/fontawesome.min.css?v16">
    <link rel="stylesheet" href="../assets/vendor/fa-solid.min.css?v16">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('themeMode') || 'auto';
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', stored === 'auto' ? (dark ? 'dark' : 'light') : stored);
            } catch (e) { /* keep the default */ }
        })();
    </script>
</head>
<body data-title-key="lookup.title">
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a class="logo" href="../index.html">
                    <img src="../logo.png" alt="huiskeuring.be logo" class="logo-img" width="48" height="48">
                    <span class="logo-text">huiskeuring.be</span>
                </a>
                <div class="header-actions">
                    <div class="select-group">
                        <label class="visually-hidden" for="languageSelect" data-i18n="btn.language">Language</label>
                        <i class="fas fa-globe" aria-hidden="true"></i>
                        <select id="languageSelect" class="header-select"></select>
                    </div>
                    <a class="btn btn-primary" href="../index.html"><i class="fas fa-list-check" aria-hidden="true"></i> <span data-i18n="compare.backToChecklist">Back to the checklist</span></a>
                </div>
            </div>
        </div>
    </header>

    <main class="lookup-page">
        <div class="container">
            <h1 class="section-title" data-i18n="lookup.title">Official lookups</h1>
            <p class="tab-intro" data-i18n="lookup.intro"></p>

            <div class="lookup-form">
                <label for="lookupAddress" data-i18n="lookup.addressLabel">Address of the property</label>
                <div class="lookup-form-row">
                    <input type="text" id="lookupAddress" autocomplete="street-address"
                           data-i18n-ph="lookup.addressPh" placeholder="Ramstraat 1, 8370 Blankenberge">
                    <button type="button" class="btn btn-secondary" id="copyAddressBtn">
                        <i class="fas fa-copy" aria-hidden="true"></i> <span data-i18n="lookup.copy">Copy address</span>
                    </button>
                    <div class="select-group lookup-region">
                        <label class="visually-hidden" for="lookupRegion" data-i18n="field.region">Region</label>
                        <i class="fas fa-location-dot" aria-hidden="true"></i>
                        <select id="lookupRegion" class="header-select"></select>
                    </div>
                </div>
                <p class="lookup-hint" data-i18n="lookup.manualHint"></p>
            </div>

            <div id="lookupGroups"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-center">
                    <p><span data-i18n="footer.madeWith">Made with</span> <i class="fas fa-heart" aria-hidden="true"></i> <span data-i18n="footer.by">by</span> <a href="https://compyra.com" target="_blank" rel="noopener noreferrer">Compyra</a></p>
                    <p class="footer-projects"><span data-i18n="footer.moreProjects">More free projects at</span> <a href="https://labidi.eu" target="_blank" rel="noopener noreferrer">labidi.eu</a></p>
                </div>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <noscript>
        <p lang="en">JavaScript is required. This page builds address links to the official Belgian registries in your browser and sends nothing to a server.</p>
        <p lang="nl">JavaScript is vereist. Deze pagina bouwt adreslinks naar de officiële Belgische databanken in uw browser en stuurt niets naar een server.</p>
        <p lang="fr">JavaScript est requis. Cette page construit des liens d'adresse vers les registres officiels belges dans votre navigateur et n'envoie rien à un serveur.</p>
    </noscript>

    <script src="../js/i18n.js?v16"></script>
    <script src="../js/legal.js?v16"></script>
    <script src="../js/links.js?v16"></script>
    <script src="../js/checklist.js?v16"></script>
    <script src="../js/checklist.nl.js?v16"></script>
    <script src="../js/checklist.fr.js?v16"></script>
    <script src="../js/core.js?v16"></script>
    <script src="lookup.js?v16"></script>
</body>
</html>
