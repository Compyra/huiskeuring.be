<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection report - huiskeuring.be</title>
    <meta name="description" content="Read-only view of a house inspection made with huiskeuring.be. The data lives in the link, never on a server.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="stylesheet" href="style.css?v22">
    <link rel="stylesheet" href="assets/vendor/fonts.css?v22">
    <link rel="stylesheet" href="assets/vendor/fontawesome.min.css?v22">
    <link rel="stylesheet" href="assets/vendor/fa-solid.min.css?v22">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('themeMode') || 'auto';
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', stored === 'auto' ? (dark ? 'dark' : 'light') : stored);
                if (localStorage.getItem('readableMode') === '1') document.documentElement.classList.add('readable');
            } catch (e) { /* keep the default */ }
        })();
    </script>
</head>
<body data-title-key="readonly.title">
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a class="logo" href="index.html">
                    <img src="./logo.png" alt="huiskeuring.be logo" class="logo-img" width="48" height="48">
                    <span class="logo-text">huiskeuring.be</span>
                </a>
                <div class="header-actions">
                    <span class="readonly-badge"><i class="fas fa-lock" aria-hidden="true"></i> <span data-i18n="readonly.badge">Read-only report</span></span>
                    <div class="select-group">
                        <label class="visually-hidden" for="languageSelect" data-i18n="btn.language">Language</label>
                        <i class="fas fa-globe" aria-hidden="true"></i>
                        <select id="languageSelect" class="header-select"></select>
                    </div>
                    <button class="btn btn-secondary" id="printBtn"><i class="fas fa-print" aria-hidden="true"></i> <span data-i18n="report.print">Print</span></button>
                    <a class="btn btn-primary" id="openAppLink" href="index.html"><i class="fas fa-pen-to-square" aria-hidden="true"></i> <span data-i18n="readonly.openApp">Open in the checklist</span></a>
                </div>
            </div>
        </div>
    </header>

    <main class="readonly-page">
        <div class="container">
            <p class="tab-intro" data-i18n="readonly.intro"></p>
            <div id="reportRoot"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-center">
                    <p><span data-i18n="footer.madeWith">Made with</span> <i class="fas fa-heart" aria-hidden="true"></i> <span data-i18n="footer.by">by</span> <a href="https://compyra.com" target="_blank" rel="noopener noreferrer">Compyra</a></p>
                    <p class="footer-projects"><span data-i18n="footer.moreProjects">More free projects at</span> <a href="https://labidi.eu" target="_blank" rel="noopener noreferrer">labidi.eu</a></p>
                </div>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/i18n.js?v22"></script>
    <script src="js/legal.js?v22"></script>
    <script src="js/links.js?v22"></script>
    <script src="js/checklist.js?v22"></script>
    <script src="js/checklist.nl.js?v22"></script>
    <script src="js/checklist.fr.js?v22"></script>
    <script src="js/core.js?v22"></script>
    <script src="js/report.js?v22"></script>
</body>
</html>
